<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>寒假回国路线簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: a travel logbook. Hero + day strip, route map, then segments of day cards, guide tabs, checklist, ledger. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E7ECEA; --ink:#17201E; --muted:#5B6866; --line:#D5DDDA;
  --accent:#13606E; --accent-soft:#D9ECEE; --flag:#B5531E; --flag-soft:#FBE9DD; --ok:#2F7D4F;
  --hk:#2A6FDB; --sh:#9C4A8F; --hz:#3B8F5A; --bj:#C0392B; --qhd:#4E5BA6; --wh:#1C9AA8; --gr:#7A8F2E; --move:#8C8F8A; --us:#5E6B78; --tbd:#B7BFBC; --other:#B08A2E;
  --map-land:#E3E9E6; --map-edge:#C9D3CF;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1A2220; --sunk:#222C29; --ink:#E6ECEA; --muted:#9AA8A4; --line:#2E3A37;
  --accent:#5FB7C4; --accent-soft:#1E3A3F; --flag:#F0965F; --flag-soft:#3A2619; --ok:#6CC08F;
  --hk:#6EA2F0; --sh:#D284C4; --hz:#6CC08A; --bj:#EE7A6C; --qhd:#8E9BE6; --wh:#5CC8D4; --gr:#B2C46A; --move:#9A9D98; --us:#93A1AF; --tbd:#4A5653; --other:#D6B35A;
  --map-land:#1F2926; --map-edge:#34413D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2220; --sunk:#222C29; --ink:#E6ECEA; --muted:#9AA8A4; --line:#2E3A37;
  --accent:#5FB7C4; --accent-soft:#1E3A3F; --flag:#F0965F; --flag-soft:#3A2619; --ok:#6CC08F;
  --hk:#6EA2F0; --sh:#D284C4; --hz:#6CC08A; --bj:#EE7A6C; --qhd:#8E9BE6; --wh:#5CC8D4; --gr:#B2C46A; --move:#9A9D98; --us:#93A1AF; --tbd:#4A5653; --other:#D6B35A;
  --map-land:#1F2926; --map-edge:#34413D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 80px;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:24px;font-weight:900}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:.02em}
.hero .sub{margin:8px 0 0;color:var(--muted)}
.codes{font-family:var(--f-mono);font-size:clamp(14px,2.4vw,18px);font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.codes .c{padding:2px 8px;border-radius:4px;color:#fff}
.codes .arr{color:var(--muted);font-weight:400}
.count{text-align:right}
.count .n{font-family:var(--f-mono);font-size:clamp(44px,8vw,72px);font-weight:600;line-height:1;color:var(--accent)}
.count .l{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.stats span{font-size:12px;color:var(--muted)}

/* day strip */
.strip-wrap{overflow-x:auto;margin-top:10px;padding-top:20px;padding-bottom:6px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(34px,1fr);gap:3px;min-width:900px}
.cell{border:0;padding:6px 0 7px;border-radius:6px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--ink)}
.cell .wd{font-size:10px;color:var(--muted)}
.cell .dd{font-family:var(--f-mono);font-size:13px;font-weight:600}
.cell .bar{position:absolute;left:3px;right:3px;bottom:2px;height:4px;border-radius:2px;background:var(--cc,var(--tbd))}
.cell.hol::after{content:attr(data-hol);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--flag);white-space:nowrap}
.cell.flagged .dd{color:var(--flag)}
.cell:hover{background:var(--accent-soft)}
.month{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--cc)}

/* map */
.map-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.map-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map-box svg{display:block;width:100%;height:auto}
.legs{display:flex;flex-direction:column;gap:0}
.leg{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.leg:last-child{border-bottom:0}
.leg .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--cc)}
.leg .t{font-weight:600}
.leg .m{font-size:13px;color:var(--muted)}
.leg .mode{font-size:13px;color:var(--accent)}

/* segments & days */
.seg{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-top:18px;border-top:2px solid var(--cc)}
.seg + .seg{margin-top:28px}
.seg-label{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start}
.seg-label .city{font-family:var(--f-display);font-size:30px;font-weight:900;color:var(--cc);line-height:1.1}
.seg-label .code{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:4px}
.seg-label .nights{font-size:13px;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px;min-width:0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;scroll-margin-top:20px}
.day.blank{padding:8px 16px}.day.blank .when .d{font-size:16px}
.day.target{box-shadow:0 0 0 2px var(--accent)}
.day .when .d{font-family:var(--f-mono);font-size:20px;font-weight:600;line-height:1.1}
.day .when .w{font-size:12px;color:var(--muted)}
.day .when .h{font-size:11px;color:var(--flag);margin-top:2px}
.day .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.day .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.day .title{font-weight:700;font-size:16px}
.day .title.empty{color:var(--muted);font-weight:400}
.day ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.day ol li{display:flex;gap:8px}
.day ol li::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--cc);margin-top:9px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{font-weight:600;color:var(--ink)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 10px}
.flag{font-size:13px;color:var(--flag);background:var(--flag-soft);border-radius:6px;padding:5px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08);color:var(--surface)}
.edit{display:grid;gap:10px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.edit input,.edit select,.edit textarea,.add input,.add select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-size:14px;width:100%;min-width:0}
.edit textarea{min-height:96px;resize:vertical}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .acts{display:flex;gap:8px;justify-content:flex-end}

/* guide */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.gcard h3{font-size:16px;margin-bottom:6px;color:var(--cc,var(--ink))}
.gcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.gcard a{color:var(--accent)}

/* checklist */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grp + .grp{margin-top:14px}
.grp h3{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
.todo{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.todo.done .tx{color:var(--muted);text-decoration:line-through}
.who{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px}
.x:hover{color:var(--flag)}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;margin-top:12px}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--ok)}
.exp{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.exp .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.totals{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:10px}
.totals div{display:flex;flex-direction:column}
.totals b{font-family:var(--f-mono);font-size:20px}
.totals span{font-size:12px;color:var(--muted)}
.add.e{grid-template-columns:minmax(0,1fr) 90px 70px 70px auto}
.empty-state{color:var(--muted);font-size:14px;padding:10px 0}
.banner{padding:10px 14px;border-radius:8px;background:var(--flag-soft);color:var(--flag);font-size:14px}

.day ol li .tm{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-right:6px}
.btn.add-trip{background:var(--accent);border-color:var(--accent);color:var(--surface);font-size:14px;padding:6px 14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;background:var(--accent);color:var(--surface);font-size:15px;font-weight:600;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab:hover{filter:brightness(1.08)}
[hidden]{display:none!important}
body{margin:0;font-size:15px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,15,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h3{font-size:20px}
.sheet .hint{font-size:13px;color:var(--muted);margin:0}
.swap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.swap select{width:auto}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}.count{text-align:left}
  .map-grid,.two{grid-template-columns:1fr}
  .seg{grid-template-columns:1fr;gap:10px}.seg-label{position:static;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .day{grid-template-columns:1fr;gap:6px}.day .when{display:flex;gap:8px;align-items:baseline}
  .edit .row{grid-template-columns:1fr}
  .add,.add.e{grid-template-columns:1fr 1fr}
  .add input[type=text]:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.day,.cell{transition:box-shadow .2s,background .2s}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="hero">
      <div>
        <div class="eyebrow">Winter break · 2026.12 – 2027.01</div>
        <h1>寒假回国路线簿</h1>
        <div class="codes" id="codes"></div>
      </div>
      <div class="count"><div class="n" id="countN">--</div><div class="l" id="countL">天后出发</div></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="strip-wrap"><div class="strip" id="strip"></div></div>
    <div class="legend" id="legend"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="route">
    <div class="sec-head"><h2>路线</h2><p>地图和右侧段落都会跟着每日安排里的城市自动更新</p></div>
    <div class="map-grid">
      <div class="map-box" id="map"></div>
      <div class="legs" id="legs"></div>
    </div>
  </section>

  <section id="plan">
    <div class="sec-head"><h2>每日安排</h2><p>点“编辑”改任何一天；橙色是还没确认的地方</p><button class="btn add-trip" type="button" data-open-add>＋ 添加行程</button></div>
    <div id="segs"><div class="empty-state">正在载入行程…</div></div>
  </section>

  <section id="guide-sec">
    <div class="sec-head"><h2>攻略</h2><p>按城市分好，出发前翻一遍</p></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="guide" id="guide"></div>
  </section>

  <section class="two">
    <div>
      <div class="sec-head"><h2>待办清单</h2><p id="todoP"></p></div>
      <div class="panel">
        <div class="progress"><i id="todoBar" style="width:0%"></i></div>
        <div id="todos"><div class="empty-state">载入中…</div></div>
        <form class="add" id="todoForm">
          <input type="text" id="todoText" placeholder="加一件要做的事，比如：订杭州酒店" required>
          <select id="todoCat"><option>预订</option><option>证件</option><option>出行准备</option><option>待确认</option><option>其他</option></select>
          <select id="todoWho"><option>我</option><option>他</option><option>一起</option></select>
          <button class="btn pri" type="submit">添加</button>
        </form>
      </div>
    </div>
    <div>
      <div class="sec-head"><h2>花费</h2><p>按币种分别合计</p></div>
      <div class="panel">
        <div class="totals" id="totals"></div>
        <div id="exps"></div>
        <form class="add e" id="expForm">
          <input type="text" id="expItem" placeholder="花在哪，比如：迪士尼门票" required>
          <input type="number" id="expAmt" placeholder="金额" step="0.01" min="0" required>
          <select id="expCur"><option>HKD</option><option>CNY</option><option>USD</option></select>
          <select id="expWho"><option>我</option><option>他</option></select>
          <button class="btn pri" type="submit">记一笔</button>
        </form>
      </div>
    </div>
  </section>
</div>

<button class="fab" id="fab" type="button" data-open-add>＋ 添加行程</button>
<div class="modal" id="addModal" hidden>
  <form class="sheet edit" id="addForm">
    <h3>添加行程</h3>
    <p class="hint">选日期就行，范围外的日期也可以，会自动加进行程里。</p>
    <div class="row"><label>日期<input type="date" id="a-date" required></label><label>时间（可不填）<input type="time" id="a-time"></label></div>
    <div class="row"><label>这一条是<select id="a-kind"><option value="plan">安排</option><option value="eat">吃</option><option value="stay">住</option></select></label><label>城市<select id="a-city"></select></label></div>
    <label>内容<input type="text" id="a-text" placeholder="比如：一品鸡煲 / 西湖骑车 / 入住苏卡" required></label>
    <div class="acts"><button type="button" class="btn" data-close-add>取消</button><button class="btn pri" type="submit">添加</button></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

      <text x="${x+(right?r*2.6:-r*2.6)}" y="${y}" font-size="${fs}" font-weight="700" text-anchor="${right?'start':'end'}" dominant-baseline="middle" fill="var(--ink)" style="font-family:var(--f-display)">${c.n}<tspan font-size="${fs*0.62}" fill="var(--muted)" font-weight="400" dx="${fs*0.3}" style="font-family:var(--f-mono)">${c.code}</tspan></text></g>`}).join('');
  $('map').innerHTML = `<svg viewBox="${x0} ${y0} ${w} ${h}" role="img" aria-label="路线地图">
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="var(--surface)"/>
    <g fill="var(--map-land)" stroke="var(--map-edge)" stroke-width="${r*0.18}" stroke-linejoin="round">${land}</g>
    ${arcs}${labels}${dots}</svg>`;
  // legs list
  const legs=[];
  const us0 = days[0];
  legs.push({cc:'--us',n:'✈',t:'美国 → 香港',m:`12/14 起飞，12/15 晚落地 HKG`,mode:'国际航班'});
  seq.forEach((s,i)=>{
    const f=pd(s.from),t=pd(s.to);
    legs.push({cc:cityOf(s.city).v,n:i+1,t:`${cityOf(s.city).n}`,m:`${f.getMonth()+1}/${f.getDate()} – ${t.getMonth()+1}/${t.getDate()} · ${s.n} 天`,mode:i? ((s.arrive.move||'').includes('→ '+cityOf(s.city).n)?s.arrive.move:'怎么过来还没定'):''});
  });
  legs.push({cc:'--us',n:'✈',t:'香港 → 美国',m:'1/10 从 HKG 起飞',mode:'国际航班'});
  $('legs').innerHTML = legs.map(l=>`<div class="leg"><div class="dot" style="--cc:var(${l.cc})">${l.n}</div><div><div class="t">${esc(l.t)}</div><div class="m">${esc(l.m)}</div>${l.mode?`<div class="mode">${esc(l.mode)}</div>`:''}</div></div>`).join('');
}

/* ---------- days ---------- */
function renderDays(){
  $('fab').hidden=!!S.editing;
  if(!S.ready.days) return;
  const days=dayList(); const segs=[];
  days.forEach(d=>{const l=segs[segs.length-1]; if(l&&l.city===d.city) l.days.push(d); else segs.push({city:d.city,days:[d]})});
  $('segs').innerHTML = segs.map(sg=>{const c=cityOf(sg.city);const a=pd(sg.days[0].id),b=pd(sg.days[sg.days.length-1].id);
    return `<div class="seg" style="--cc:${cv(sg.city)}"><div class="seg-label"><div class="city">${c.n}</div><div class="code">${c.code} · ${a.getMonth()+1}/${a.getDate()}${sg.days.length>1?` – ${b.getMonth()+1}/${b.getDate()}`:''}</div><div class="nights">${sg.days.length} 天</div></div>
    <div class="days">${sg.days.map(dayCard).join('')}</div></div>`}).join('');
}
function dayCard(d){
  const dt=pd(d.id), hol=HOL[d.id];
  const when=`<div class="when"><div class="d">${dt.getMonth()+1}.${String(dt.getDate()).padStart(2,'0')}</div><div class="w">周${WD[dt.getDay()]}</div>${hol?`<div class="h">${hol}</div>`:''}</div>`;
  if(S.editing===d.id){
    const opts=Object.entries(CITIES).map(([k,c])=>`<option value="${k}"${k===d.city?' selected':''}>${c.n}</option>`).join('');
    return `<div class="day" id="day-${d.id}" style="--cc:${cv(d.city)}">${when}<form class="edit" data-save="${d.id}">
      <div class="row"><label>城市<select id="e-city">${opts}</select></label><label>这天的主题<input id="e-title" value="${esc(d.title)}" placeholder="比如：港大 + 中环"></label></div>
      <label>安排（一行一项）<textarea id="e-plan" placeholder="上午 去港大&#10;下午 中环石板街">${esc((d.plan||[]).join('\n'))}</textarea></label>
      <div class="row"><label>住哪<input id="e-stay" value="${esc(d.stay)}"></label><label>交通（换城市那天填）<input id="e-move" value="${esc(d.move)}" placeholder="比如：高铁 虹桥→杭州东 约1小时"></label></div>
      <div class="row"><label>地图上的交通标签<select id="e-mode">${['','飞机','高铁','自驾','待定'].map(m=>`<option${m===d.mode?' selected':''}>${m}</option>`).join('')}</select></label><label>待确认（一行一条）<input id="e-flags" value="${esc((d.flags||[]).join('；'))}" placeholder="用；分隔"></label></div>
      <label>吃什么<input id="e-eat" value="${esc(d.eat)}" placeholder="比如：一品鸡煲；La Vache（要预约）"></label>
      <label>备注<input id="e-note" value="${esc(d.note)}"></label>
      <div class="swap">把这一整天和<select id="e-swap">${DATES.filter(x=>x!==d.id).map(x=>{const t=pd(x);return `<option value="${x}">${t.getMonth()+1}/${t.getDate()} ${esc(cityOf((S.days[x]||{}).city||'tbd').n)} ${esc(((S.days[x]||{}).title||'').slice(0,12))}</option>`}).join('')}</select><button type="button" class="btn" data-swap="${d.id}">对调</button></div>
      <div class="acts"><button type="button" class="btn" data-cancel>取消</button><button class="btn pri" type="submit">保存</button></div></form></div>`;
  }
  const plan=(d.plan||[]).filter(Boolean);
  const blank=!d.title&&!plan.length&&!d.note&&!d.eat&&!d.stay&&!(d.flags||[]).length;
  return `<div class="day${blank?' blank':''}" id="day-${d.id}" style="--cc:${cv(d.city)}">${when}<div class="body">
    <div class="top"><div class="title${d.title?'':' empty'}">${d.title?esc(d.title):'还没安排'}</div><button class="btn" data-edit="${d.id}">编辑</button></div>
    ${plan.length?`<ol>${plan.map(p=>{const m=String(p).match(/^(\d{1,2}:\d{2})\s+(.*)$/);return `<li><span>${m?`<span class="tm">${m[1]}</span>${esc(m[2])}`:esc(p)}</span></li>`}).join('')}</ol>`:''}
    ${(d.stay||d.move||d.eat)?`<div class="meta">${d.move?`<span>交通 <b>${esc(d.move)}</b></span>`:''}${d.eat?`<span>吃 <b>${esc(d.eat)}</b></span>`:''}${d.stay?`<span>住 <b>${esc(d.stay)}</b></span>`:''}</div>`:''}
    ${(d.flags||[]).map(f=>`<div class="flag">待确认：${esc(f)}</div>`).join('')}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
  </div></div>`;
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){const el=$('day-'+go.dataset.go); if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('target');setTimeout(()=>el.classList.remove('target'),1600)} return}
  const ed=e.target.closest('[data-edit]'); if(ed){S.editing=ed.dataset.edit;renderDays();const t=$('e-title');t&&t.focus();return}
  if(e.target.closest('[data-cancel]')){S.editing=null;renderDays();return}
  const sw=e.target.closest('[data-swap]'); if(sw&&db){swapDays(sw.dataset.swap,$('e-swap').value);return}
  if(e.target.closest('[data-open-add]')){openAdd();return}
  if(e.target.closest('[data-close-add]')||e.target.id==='addModal'){$('addModal').hidden=true;return}
  const tb=e.target.closest('[data-tab]'); if(tb){S.tab=tb.dataset.tab;try{localStorage.setItem('tab',S.tab)}catch(_){};renderGuide();return}
  const tx=e.target.closest('[data-deltodo]'); if(tx&&db){db.doc('todos/'+tx.dataset.deltodo).delete().catch(err);return}
  const ex=e.target.closest('[data-delexp]'); if(ex&&db){db.doc('expenses/'+ex.dataset.delexp).delete().catch(err);return}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-save]'); if(!f) return; e.preventDefault(); if(!db) return;
  const id=f.dataset.save, old=dayList().find(d=>d.id===id);
  const body=Object.assign({},old,{date:id,city:$('e-city').value,title:$('e-title').value.trim(),
    plan:$('e-plan').value.split('\n').map(s=>s.trim()).filter(Boolean),stay:$('e-stay').value.trim(),move:$('e-move').value.trim(),
    mode:$('e-mode').value,eat:$('e-eat').value.trim(),note:$('e-note').value.trim(),flags:$('e-flags').value.split(/[；;\n]/).map(s=>s.trim()).filter(Boolean)});
  delete body.id;
  S.editing=null;
  try{await db.doc('days/'+id).set(body)}catch(x){err(x)}
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-todo]'); if(c&&db){db.doc('todos/'+c.dataset.todo).update({done:c.checked}).catch(err)}
});
async function swapDays(a,b){
  if(!a||!b||a===b) return;
  const all=dayList(), A=all.find(d=>d.id===a), B=all.find(d=>d.id===b);
  const strip=o=>{const c=Object.assign({},o);delete c.id;return c};
  S.editing=null;
  try{await db.doc('days/'+a).set(Object.assign(strip(B),{date:a}));await db.doc('days/'+b).set(Object.assign(strip(A),{date:b}))}catch(x){err(x)}
  setTimeout(()=>{const el=$('day-'+b);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('target');setTimeout(()=>el.classList.remove('target'),1600)}},300);
}
function openAdd(){
  const opts='<option value="">不改这天的城市</option>'+Object.entries(CITIES).filter(([k])=>k!=='tbd').map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('');
  $('a-city').innerHTML=opts;
  if(!$('a-date').value) $('a-date').value=S.lastAdd||'2026-12-15';
  $('addModal').hidden=false; $('a-text').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('addModal').hidden)$('addModal').hidden=true});
function err(x){const b=$('banner');b.hidden=false;b.textContent=(x&&x.code==='invalid_argument')?'你现在只有查看权限，改动没有保存。请让对方把你设为“贡献者”或“编辑者”。':'保存没成功，请稍后再试一次。'}

/* ---------- guide ---------- */
function renderGuide(){
  const gs=Object.entries(S.guides).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(a.order||0)-(b.order||0));
  if(!gs.length){$('tabs').innerHTML='';$('guide').innerHTML='<div class="empty-state">攻略还没写进来。让 Claude 补充后会出现在这里。</div>';return}
  if(!S.tab||!S.guides[S.tab]) S.tab=gs[0].k;
  $('tabs').innerHTML=gs.map(g=>`<button class="tab" role="tab" data-tab="${esc(g.k)}" aria-selected="${g.k===S.tab}">${esc(g.name)}</button>`).join('');
  const g=S.guides[S.tab];
  $('guide').innerHTML=(g.sections||[]).map(s=>`<div class="gcard" style="--cc:${CITIES[S.tab]?cv(S.tab):'var(--ink)'}"><h3>${esc(s.h)}</h3><ul>${(s.items||[]).map(i=>`<li>${linkify(i)}</li>`).join('')}</ul></div>`).join('');
}
function linkify(s){return esc(s).replace(/(https:\/\/[^\s，。）)]+)/g,'<a href="$1" target="_blank" rel="noopener">链接</a>')}

/* ---------- todos ---------- */
const CATS=['待确认','预订','证件','出行准备','其他'];
function renderTodos(){
  if(!S.ready.todos) return;
  const ts=Object.entries(S.todos).map(([id,v])=>Object.assign({id},v));
  const done=ts.filter(t=>t.done).length;
  $('todoBar').style.width=(ts.length?done/ts.length*100:0)+'%';
  $('todoP').textContent=ts.length?`完成 ${done} / ${ts.length}`:'';
  if(!ts.length){$('todos').innerHTML='<div class="empty-state">清单是空的。用下面的输入框加第一件事。</div>';return}
  $('todos').innerHTML=CATS.concat([...new Set(ts.map(t=>t.cat))].filter(c=>!CATS.includes(c))).map(cat=>{
    const items=ts.filter(t=>(t.cat||'其他')===cat).sort((a,b)=>(a.done-b.done)||((a.order||0)-(b.order||0)));
    if(!items.length) return '';
    return `<div class="grp"><h3>${esc(cat)}</h3>${items.map(t=>`<div class="todo${t.done?' done':''}"><input type="checkbox" id="t-${t.id}" data-todo="${t.id}"${t.done?' checked':''}><label class="tx" for="t-${t.id}">${esc(t.text)}</label><span class="who">${esc(t.who||'一起')}</span><button class="x" data-deltodo="${t.id}" aria-label="删除">×</button></div>`).join('')}</div>`}).join('');
}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;
  const id=$('a-date').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(id)) return;
  const t=$('a-time').value, kind=$('a-kind').value, city=$('a-city').value, text=$('a-text').value.trim(); if(!text) return;
  const old=Object.assign({date:id,city:'tbd',title:'',plan:[],stay:'',eat:'',move:'',mode:'',note:'',flags:[]},S.days[id]||{});
  const body=JSON.parse(JSON.stringify(old)); body.date=id;
  if(city) body.city=city;
  if(kind==='plan'){const item=(t?t+' ':'')+text; body.plan=(body.plan||[]).concat(item);
    if(t){const tm=x=>{const m=String(x).match(/^(\d{1,2}):(\d{2})\s/);return m?(+m[1])*60+(+m[2]):null};
      const timed=body.plan.filter(x=>tm(x)!==null).sort((a,b)=>tm(a)-tm(b)); let i=0; body.plan=body.plan.map(x=>tm(x)!==null?timed[i++]:x)}}
  else if(kind==='eat') body.eat=[body.eat,(t?t+' ':'')+text].filter(Boolean).join('；');
  else body.stay=text;
  if(!body.title&&kind==='plan') body.title=text;
  S.lastAdd=id;
  try{await db.doc('days/'+id).set(body);$('a-text').value='';$('a-time').value='';$('addModal').hidden=true;
    setTimeout(()=>{const el=$('day-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('target');setTimeout(()=>el.classList.remove('target'),1600)}},300)}catch(x){err(x)}
});
$('todoForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const t=$('todoText').value.trim();if(!t)return;
  try{await db.collection('todos').add({text:t,cat:$('todoCat').value,who:$('todoWho').value,done:false,order:Date.now()});$('todoText').value=''}catch(x){err(x)}});

/* ---------- expenses ---------- */
function renderExps(){
  if(!S.ready.exps) return;
  const es=Object.entries(S.exps).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(b.created||0)-(a.created||0));
  const tot={}; es.forEach(x=>{tot[x.cur]=(tot[x.cur]||0)+Number(x.amount||0)});
  $('totals').innerHTML=Object.keys(tot).length?Object.entries(tot).map(([c,v])=>`<div><b>${v.toLocaleString('zh-CN',{maximumFractionDigits:2})}</b><span>${c} 合计</span></div>`).join(''):'';
  $('exps').innerHTML=es.length?es.map(x=>`<div class="exp"><span class="mono" style="color:var(--muted);font-size:12px">${esc(x.date||'')}</span><span>${esc(x.item)}</span><span class="who">${esc(x.who)}</span><span class="amt">${Number(x.amount).toLocaleString('zh-CN',{maximumFractionDigits:2})} <small>${esc(x.cur)}</small></span><button class="x" data-delexp="${x.id}" aria-label="删除">×</button></div>`).join('')
    :'<div class="empty-state">还没有记账。订了机票、酒店或门票就记一笔，这里会自动按币种合计。</div>';
}
$('expForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const n=new Date();
  try{await db.collection('expenses').add({item:$('expItem').value.trim(),amount:Number($('expAmt').value),cur:$('expCur').value,who:$('expWho').value,date:(n.getMonth()+1)+'/'+n.getDate(),created:Date.now()});$('expItem').value='';$('expAmt').value=''}catch(x){err(x)}});

/* ---------- Supabase storage: one table trip_docs(col,id,data) ---------- */
function makeDb(sb){
  const T='trip_docs', cache={}, listeners={}, errs={};
  const emit=col=>(listeners[col]||[]).forEach(f=>f({docs:Object.entries(cache[col]||{}).map(([id,v])=>({id,data:()=>v}))}));
  async function load(col){const {data,error}=await sb.from(T).select('id,data').eq('col',col);if(error)throw error;cache[col]={};data.forEach(r=>cache[col][r.id]=r.data);emit(col)}
  const reloadAll=()=>Object.keys(listeners).forEach(c=>load(c).catch(e=>errs[c]&&errs[c](e)));
  sb.channel('trip-docs').on('postgres_changes',{event:'*',schema:'public',table:T},p=>{
    const r=(p.new&&p.new.col)?p.new:p.old; if(!r||!r.col||!cache[r.col])return;
    if(p.eventType==='DELETE')delete cache[r.col][r.id];else cache[r.col][r.id]=p.new.data;emit(r.col)}).subscribe();
  setInterval(()=>{if(!document.hidden&&!S.editing)reloadAll()},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reloadAll()});
  const doc=path=>{const [col,id]=path.split('/');return{
    async set(data){(cache[col]=cache[col]||{})[id]=data;emit(col);const {error}=await sb.from(T).upsert({col,id,data,updated_at:new Date().toISOString()});if(error)throw error},
    async update(patch){const cur=(cache[col]||{})[id]||{};await doc(path).set(Object.assign({},cur,patch))},
    async delete(){if(cache[col])delete cache[col][id];emit(col);const {error}=await sb.from(T).delete().eq('col',col).eq('id',id);if(error)throw error}}};
  return {doc,collection:col=>({
    onSnapshot(fn,errFn){(listeners[col]=listeners[col]||[]).push(fn);errs[col]=errFn;load(col).catch(e=>errFn&&errFn(e));return()=>{}},
    async add(data){const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await doc(col+'/'+id).set(data);return doc(col+'/'+id)}})};
}
/* ---------- boot ---------- */
function renderAll(){renderHeader();renderMap();renderDays()}
try{S.tab=localStorage.getItem('tab')}catch(_){}
renderAll();renderGuide();
(async()=>{
  const C=window.TRIP_CONFIG||{};
  if(!C.url||!C.key||!window.supabase){$('banner').hidden=false;$('banner').textContent='还没连上数据库：请按 README 在 config.js 里填好 Supabase 的地址和密钥。';$('segs').innerHTML='';return}
  db = makeDb(window.supabase.createClient(C.url,C.key));
  const sub=(col,key,fn)=>db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[key]=o;S.ready[key]=true;fn()},e=>{$('banner').hidden=false;$('banner').textContent='共享数据暂时断开，刷新页面试试。'});
  sub('days','days',()=>{ DATES=computeDates(); if(!S.editing) renderAll(); else {renderHeader();renderMap()} });
  sub('todos','todos',renderTodos);
  sub('expenses','exps',renderExps);
  sub('guides','guides',renderGuide);
})();
</script>
